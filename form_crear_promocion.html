<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <title>Crear Promoción</title>
</head>

<body>
    <h1>Crear Promoción</h1>
    <form id="promoForm" enctype="multipart/form-data">
        <input type="text" name="titulo" placeholder="Título" required /><br />
        <input type="text" name="codigo" placeholder="Código (opcional)" /><br />
        <textarea name="descripcion" placeholder="Descripción"></textarea><br />
        <input type="date" name="fechaInicio" /><br />
        <input type="date" name="fechaFin" /><br />

        <select id="productos" name="productos" multiple required></select><br />

        <input type="file" name="imagenes" multiple accept="image/*" required /><br />
        <button type="submit">Crear Promoción</button>
    </form>

    <script>
        // Cargar productos disponibles
        fetch("http://localhost:5000/api/producto/producto_lista")
            .then((res) => res.json())
            .then((data) => {
                const select = document.getElementById("productos")
                data.data.forEach((producto) => {
                    const opt = document.createElement("option")
                    opt.value = producto.id
                    opt.textContent = producto.nombre
                    select.appendChild(opt)
                })
            })

        document.getElementById("promoForm").addEventListener("submit", async (e) => {
            e.preventDefault()
            const form = e.target
            const formData = new FormData(form)

            const productosIds = Array.from(form.productos.selectedOptions).map((opt) => opt.value)

            for (const id of productosIds) {
                formData.append("productos", JSON.stringify(id))
            }

            const res = await fetch("http://localhost:5000/api/promocion/crear_promocion", {
                method: "POST",
                body: formData,
            })

            const data = await res.json()
            console.log(data)
        })
    </script>

</body>

</html>
